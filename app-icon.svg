<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Lifeline">
  <!-- App icon: the Lifeline symbol on a near-black rounded tile -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141722"/>
      <stop offset="1" stop-color="#07070b"/>
    </linearGradient>
    <linearGradient id="cross" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f7fd"/>
      <stop offset="1" stop-color="#e0e3ee"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1d55d6"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#5aa8ff"/>
    </linearGradient>
    <clipPath id="plus">
      <rect x="133" y="22" width="157" height="380" rx="36"/>
      <rect x="25" y="136" width="370" height="170" rx="36"/>
    </clipPath>
    <mask id="gap" maskUnits="userSpaceOnUse" x="-20" y="-20" width="460" height="460">
      <rect x="-20" y="-20" width="460" height="460" fill="#fff"/>
      <path d="M98 255 C160 247 172 121 300 118 L300 140 C195 140 182 255 120 255 Z" fill="#000"/>
      <path d="M300 208 C245 208 228 306 150 306 L128 306 L128 323 L140 323 C252 323 262 214 306 210 Z" fill="#000"/>
    </mask>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#tile)"/>
  <rect x="64.5" y="64.5" width="895" height="895" rx="199.5" fill="none" stroke="#fff" stroke-opacity="0.07"/>
  <g transform="translate(512 512) scale(1.72) translate(-210 -212)">
    <g clip-path="url(#plus)">
      <g mask="url(#gap)">
        <rect x="133" y="22" width="157" height="380" rx="36" fill="url(#cross)"/>
        <rect x="25" y="136" width="370" height="170" rx="36" fill="url(#cross)"/>
      </g>
      <path d="M-10 255 H120 C182 255 195 137 300 137 H430 V208 H300 C245 208 228 306 150 306 H-10 Z" fill="url(#band)"/>
    </g>
  </g>
</svg>
