name: Release

# Builds installers for Windows, macOS and Linux and publishes them as a
# GitHub release named after the version in src-tauri/tauri.conf.json.
# Run it from the Actions tab (Run workflow) or push a matching tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev patchelf
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Lifeline v__VERSION__
          releaseCommitish: ${{ github.sha }}
          releaseBody: |
            Installers for Windows, macOS (Apple Silicon and Intel) and Linux.

            | System | File |
            | --- | --- |
            | Windows 10 and 11 | `Lifeline_*_x64-setup.exe` (or the `.msi`) |
            | macOS 10.15 or later | `Lifeline_*_universal.dmg` |
            | Linux | `Lifeline_*_amd64.AppImage` or `.deb` |

            The installers are not code-signed yet. On Windows, SmartScreen may show "Windows protected your PC": choose More info, then Run anyway. On macOS, right-click the app, choose Open, then confirm.

            See the [README](https://github.com/sekaikx/lifeline#readme) for what Lifeline does and how to use it.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
