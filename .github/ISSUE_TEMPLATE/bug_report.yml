name: Bug report
description: Something in Lifeline does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a security problem, please use a private report instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Include any error message shown in the app or printed by the `lifeline` command.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Steps from a fresh start. If it depends on a place, give the preset or the latitude, longitude and size, and attach the scenario file from Save if you can.
      placeholder: |
        1. Load Dadu, Pakistan
        2. Satellite flood check, As of 2022-09-05
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Lifeline version
      placeholder: "0.2.0, or the commit if built from source"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux (.deb)
        - Linux (AppImage)
        - Built from source
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Part of Lifeline
      multiple: true
      options:
        - Plan workspace
        - Airdrop lab
        - Flood check
        - Loading data (elevation, roads, weather, imagery)
        - Command line
        - Installer or startup
        - Model training (ml/)
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, OS version, logs.
